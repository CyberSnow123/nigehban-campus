# Virtual uv workspace root. Members hold the real packages.
[tool.uv.workspace]
members = ["apps/api", "services/cv", "packages/contracts"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "ruff", "httpx"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/tests", "apps/api/tests", "services/cv/tests"]
addopts = "--import-mode=importlib"
