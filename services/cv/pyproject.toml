[project]
name = "nigehban-cv"
version = "0.1.0"
description = "Nigehban Campus CV worker"
requires-python = ">=3.11"
dependencies = ["nigehban-contracts", "httpx", "numpy", "opencv-python-headless"]

[project.scripts]
nigehban-cv = "nigehban_cv.cli:main"

[tool.uv.sources]
nigehban-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nigehban_cv"]
