[project]
name = "nigehban-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for Nigehban Campus"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nigehban_contracts"]
