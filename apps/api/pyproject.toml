[project]
name = "nigehban-api"
version = "0.1.0"
description = "Nigehban Campus FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "nigehban-contracts",
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]",
  "pydantic-settings",
  "pyjwt",
  "argon2-cffi",
  "python-multipart",
  "slowapi>=0.1.10",
  "tzdata>=2026.6",
]

[tool.uv.sources]
nigehban-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
